# Cubby default configuration (generic, no personal data).
#
# Copy this file to ~/.config/cubby/config.toml and edit it to add your own
# categories and keywords. Categories are tried top to bottom within each
# stage, so put the most specific ones first.

[settings]
source = "~/Downloads"
delay = "1m"             # wait this long after a file lands before moving it
interval = "30s"         # how often watch mode polls the folder
content_scan = true      # peek inside files when the name is uninformative
content_max_bytes = 4000
unsorted_dir = "_Unsorted"
dedupe = false           # set true to drop byte-identical duplicate downloads
notify = true            # desktop notification when the agent cannot sort a file

# Invoices (and any category with date_folders) are filed into a month/year
# subfolder. "numeric" gives 2026-07; "letters" gives "juillet 2026" (month_lang
# = "fr") or "July 2026" ("en"). Override per run with --month-style/--month-lang.
month_style = "numeric"
month_lang = "fr"

# Known vendors, matched first when renaming an invoice, so a cryptic filename
# like "3c0fe.pdf" whose text mentions Spotify still becomes "spotify facture …".
vendors = [
    "spotify", "netflix", "youtube", "apple", "google", "microsoft", "amazon",
    "aws", "openai", "anthropic", "github", "gitlab", "notion", "figma", "canva",
    "adobe", "vercel", "stripe", "linkedin", "ovh", "gandi", "scaleway", "hetzner",
    "orange", "sfr", "free", "bouygues", "proton", "dropbox", "slack", "zoom",
    # AI / dev SaaS and providers seen in real invoices.
    "openrouter", "resend", "railway", "suno", "spline", "tripo", "lovable",
    "replicate", "elevenlabs", "heygen", "cursor", "perplexity", "mistral",
    "credal", "easyjet", "heytelecom",
]

# --- Finance and administration -------------------------------------------

[[category]]
name = "Invoices"
date_folders = true      # file into a month/year subfolder (e.g. 2026-07/)
vendor_rename = true      # rename to "<vendor> facture <date>.<ext>"
name_patterns = [
    "invoice", "receipt", "facture", "\\breçu\\b", "payment[-_ ]?confirmation",
    "order[-_ ]receipt", "\\bbill\\b", "\\bdevis\\b",
]
content_patterns = [
    "num[ée]ro de facture", "invoice number", "payment confirmation",
    "montant (?:total|à payer|du)", "amount due", "total due", "\\bvat\\b.*total",
]
late_content_patterns = [
    # Tried after every category's content_patterns, so a statement or a
    # contract that mentions an invoice keeps its category. The word alone is
    # not enough: emails and notes mention invoices too. It must open one of
    # the document's first two lines, as its title does, and be followed on
    # that line by a date or an amount
    # ("Facture Free Mobile du 05/08/2026"), or stand alone as a heading
    # ("Facture n° 1042", "Invoice #A-17") with a date or an amount below.
    '\A\s*+(?:[^\n]*+\n)?[ \t]*+(?:facture|invoice)\b[^\n]{0,80}?(?:\b\d{1,2}[/.-]\d{1,2}[/.-](?:19|20)\d{2}\b|\b20\d{2}-\d{2}-\d{2}\b|\d[\d ]*[,.]\d{2} ?(?:€|eur\b|usd\b|\$)|(?:€|\$|\beur\b|\busd\b) ?\d[\d ]*[,.]\d{2})',
    '\A\s*+(?:[^\n]*+\n)?[ \t]*+(?:facture|invoice)[ \t]*(?:(?:n[°o]?\.?|no\.?|\#|number|num[ée]ro)[ \t]*[\w/-]+)?[ \t]*\n[\s\S]{0,300}?(?:\b\d{1,2}[/.-]\d{1,2}[/.-](?:19|20)\d{2}\b|\b20\d{2}-\d{2}-\d{2}\b|\d[\d ]*[,.]\d{2} ?(?:€|eur\b|usd\b|\$)|(?:€|\$|\beur\b|\busd\b) ?\d[\d ]*[,.]\d{2})',
]

[[category]]
name = "Bank-Statements"
date_folders = true      # statements are filed by month too (no renaming)
name_patterns = ["statement", "relev[ée]", "\\bbank\\b"]
content_patterns = [
    "relev[ée] (?:de compte|électronique)", "\\biban\\b", "\\bbic\\b",
    "account statement", "virement", "\\bsolde\\b", "opening balance",
]

[[category]]
name = "Legal"
name_patterns = [
    "contract", "contrat", "convention", "agreement", "\\bnda\\b", "statuts",
    "terms[-_ ]of", "\\bpolicy\\b", "\\bcharter\\b",
]
content_patterns = [
    "association sans but lucratif", "hereby agree", "terms and conditions",
    "this agreement", "il a été convenu", "entre les soussignés", "\\bclause\\b",
]

[[category]]
name = "Resumes"
name_patterns = [
    "\\bcv\\b", "résumé", "\\bresume\\b", "curriculum", "europass",
    "cover[-_ ]letter", "lettre[-_ ]de[-_ ]motivation",
]
content_patterns = [
    "curriculum vitae", "work experience", "expériences? professionnelles?",
    "professional experience",
]

# --- Media (extension is decisive: strong_ext) ----------------------------

[[category]]
name = "Images"
extensions = ["png", "jpg", "jpeg", "gif", "svg", "webp", "heic", "bmp", "tiff", "ico"]
strong_ext = true

[[category]]
name = "Video"
extensions = ["mp4", "mov", "mkv", "avi", "webm", "m4v", "flv"]
strong_ext = true

[[category]]
name = "Music"
name_patterns = ["\\bstems\\b", "\\.logicx"]
extensions = ["mp3", "wav", "flac", "m4a", "aac", "aiff", "ogg", "logicx"]
strong_ext = true

[[category]]
name = "Installers"
extensions = ["dmg", "pkg", "exe", "msi", "deb", "rpm", "appimage", "apk"]
strong_ext = true

[[category]]
name = "Archives"
extensions = ["zip", "rar", "7z", "tar", "gz", "bz2", "xz", "tgz"]
strong_ext = true

[[category]]
name = "Fonts"
extensions = ["ttf", "otf", "woff", "woff2"]
strong_ext = true

# --- Documents and office -------------------------------------------------

[[category]]
name = "Presentations"
name_patterns = ["pitch[-_ ]?deck", "\\bdeck\\b", "slides", "presentation"]
extensions = ["pptx", "ppt", "key", "odp"]

[[category]]
name = "Ebooks"
extensions = ["epub", "mobi", "azw3"]

[[category]]
name = "Subtitles"
extensions = ["srt", "vtt", "ass", "sub"]

[[category]]
name = "Code"
extensions = ["py", "js", "ts", "tsx", "jsx", "go", "rs", "rb", "java", "c", "cpp", "sh", "sql"]

[[category]]
name = "Design"
extensions = ["psd", "ai", "sketch", "fig", "xd", "afdesign", "afphoto"]

[[category]]
name = "Travel"
name_patterns = [
    "boarding[-_ ]?pass", "\\be-?ticket", "\\bitinerary\\b", "\\bbooking\\b",
    "réservation", "eurostar", "\\bflight\\b", "\\bboarding\\b",
]
content_patterns = ["boarding pass", "booking reference", "passenger name", "\\bPNR\\b"]

# Catch-all for office and text files not matched above. Listed last so its
# broad extension set never shadows a more specific category.
[[category]]
name = "Documents"
name_patterns = ["_files$"]
extensions = [
    "pdf", "doc", "docx", "odt", "rtf", "txt", "md", "pages",
    "html", "htm", "csv", "tsv", "xlsx", "xls", "ods", "numbers", "json",
]

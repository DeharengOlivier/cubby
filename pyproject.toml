[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cubby-sort"
version = "0.1.0"
description = "Tidy your Downloads folder automatically with a name-content-type cascade."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Olivier Dehareng" }]
keywords = ["downloads", "file-organizer", "automation", "cli", "tidy"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
# Richer content extraction when system tools (pdftotext, textutil) are absent.
extract = ["pypdf>=4", "python-docx>=1", "openpyxl>=3"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3",
    "bandit>=1.7",
    "pip-audit>=2",
]

[project.scripts]
cubby = "cubby.cli:main"

[project.urls]
Homepage = "https://github.com/DeharengOlivier/cubby"
Repository = "https://github.com/DeharengOlivier/cubby"
Issues = "https://github.com/DeharengOlivier/cubby/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cubby"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# A warning nobody reads is a warning hiding a real one.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/cubby"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.bandit]
# Skipped with reasons, not because they are inconvenient:
#   B404 importing subprocess is not itself a finding;
#   B603 every call passes a list and never shell=True, which is the safe form
#        this check exists to steer you towards;
#   B607 the commands run the absolute path returned by shutil.which, which
#        bandit cannot see through a variable. That property is pinned by
#        test_the_resolved_absolute_path_is_executed_not_a_bare_name, which is
#        a stronger guarantee than the static check it replaces.
skips = ["B404", "B603", "B607"]

[tool.mypy]
python_version = "3.11"
packages = ["cubby"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

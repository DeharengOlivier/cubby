[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "cubby-sort"
version = "0.4.0"
description = "Tidy your Downloads folder automatically with a name-content-type cascade."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Olivier Dehareng" }]
keywords = ["downloads", "file-organizer", "automation", "cli", "tidy"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
# Richer content extraction when system tools (pdftotext, textutil) are absent.
extract = ["pypdf>=4", "python-docx>=1", "openpyxl>=3"]

[dependency-groups]
# Development tools, pinned exactly by uv.lock. `uv sync --locked` installs them.
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "import-linter>=2",
    "diff-cover>=9",
    "pre-commit>=3",
    "bandit>=1.7",
    "pip-audit>=2",
    "mutmut>=3",
    "fastjsonschema>=2.22.2",
]

[project.scripts]
cubby = "cubby.cli:main"

[project.urls]
Homepage = "https://github.com/DeharengOlivier/cubby"
Repository = "https://github.com/DeharengOlivier/cubby"
Issues = "https://github.com/DeharengOlivier/cubby/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cubby"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM",
    "C4",   # comprehensions
    "PT",   # pytest style
    "RET",  # return discipline
    "PTH",  # pathlib over os.path
    "BLE",  # blind except: every broad catch must say why (noqa with a reason)
    "S",    # bandit rules, in the editor as well as in CI
    "PL",   # pylint subset: complexity and argument budgets
    "C90",  # McCabe complexity, held at 10 (CODING-RULES code shape budget)
    "RUF",
    "TID251",  # banned APIs below
]
ignore = [
    "PLR2004",  # magic values in comparisons: the tests compare literal expectations
    "S603",     # subprocess without shell: the safe form, see [tool.bandit]
    "S607",     # partial path: we resolve absolute paths with shutil.which
]

# State files are parsed through `state.parse_json`, which turns the parser's
# RecursionError on a deeply nested line into a decode error like any damage.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"json.loads".msg = "use cubby.adapters.state.parse_json"
"json.load".msg = "use cubby.adapters.state.parse_json"
"json.JSONDecoder".msg = "use cubby.adapters.state.parse_json"
"json.decoder".msg = "use cubby.adapters.state.parse_json"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "PLR0913", "PLC0415", "TID251"]
# Maintenance scripts read GitHub's JSON, not cubby's state files.
"scripts/**" = ["TID251"]
"src/cubby/adapters/state.py" = ["TID251"]
"benchmarks/**" = ["S", "T20", "TID251"]

[tool.ruff.lint.pylint]
max-args = 7
max-branches = 12

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
# A warning nobody reads is a warning hiding a real one.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/cubby"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.bandit]
# Skipped with reasons, not because they are inconvenient:
#   B404 importing subprocess is not itself a finding;
#   B603 every call passes a list and never shell=True, which is the safe form
#        this check exists to steer you towards;
#   B607 the commands run the absolute path returned by shutil.which, which
#        bandit cannot see through a variable. That property is pinned by
#        test_the_resolved_absolute_path_is_executed_not_a_bare_name, which is
#        a stronger guarantee than the static check it replaces.
skips = ["B404", "B603", "B607"]

[tool.mypy]
python_version = "3.11"
packages = ["cubby"]
strict = true
# The optional extraction backends (pypdf, docx, openpyxl) ship no stubs and are
# not installed in the default environment; they are imported lazily inside a
# try block and their absence is a supported state, not a typing question.
ignore_missing_imports = true

[tool.importlinter]
root_package = "cubby"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: cli over app over adapters over domain"
type = "layers"
layers = ["cubby.cli", "cubby.app", "cubby.adapters", "cubby.domain"]

[[tool.importlinter.contracts]]
name = "The domain never spawns processes or touches files through os or shutil"
type = "forbidden"
source_modules = ["cubby.domain"]
forbidden_modules = ["os", "shutil", "subprocess", "cubby.adapters", "cubby.app", "cubby.cli"]

# Mutation testing is run on the modules whose silent breakage would lose or
# misplace a user's files: the undo journal, path containment and naming.
# `make mutation`; results are recorded in docs/audits/.
[tool.mutmut]
source_paths = ["src/cubby"]
only_mutate = [
    "src/cubby/adapters/journal.py",
    "src/cubby/domain/naming.py",
    "src/cubby/adapters/filesystem.py",
    "src/cubby/app/undo.py",
]
# The end-to-end journey runs cubby in a child process, outside the mutants.
pytest_add_cli_args = ["--deselect", "tests/test_agent_journey.py"]
# Tests of the shell scripts run them from the checkout next to the tests, and
# the JSON contract tests read the published schemas.
also_copy = ["uninstall.sh", "scripts", "docs/schemas"]

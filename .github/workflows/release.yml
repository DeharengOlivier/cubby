name: Release

# A tag vX.Y.Z on main builds the wheel and sdist from the locked toolchain,
# checks that the tag matches the package version, runs the test suite, smoke-
# tests the built wheel in a clean environment, and publishes a GitHub release with the artifacts and their
# SHA-256 sums. Nothing is published to PyPI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to check the tag is on main
      - name: Tag is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "tag ${GITHUB_REF_NAME} points at a commit that is not on main" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          version="$(uv run --locked python -c 'import cubby; print(cubby.__version__)')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
      - name: Build (backend pinned by hash)
        run: uv build --build-constraint build-constraints.txt --require-hashes
      - name: Artifacts carry the tag's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/cubby_sort-${version}-py3-none-any.whl"
          test -f "dist/cubby_sort-${version}.tar.gz"
      - name: Test suite
        run: |
          uv sync --locked --all-extras
          uv run --locked pytest
      - name: Smoke-test the built wheel on its own
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env/bin/python dist/*.whl
          mkdir -p /tmp/smoke/Downloads && touch /tmp/smoke/Downloads/a.pdf
          HOME=/tmp/smoke CUBBY_STATE_DIR=/tmp/smoke/state /tmp/wheel-env/bin/cubby --version
          HOME=/tmp/smoke CUBBY_STATE_DIR=/tmp/smoke/state \
            /tmp/wheel-env/bin/cubby plan --source /tmp/smoke/Downloads --json
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - name: Rebuild matches the artifacts
        run: scripts/rebuild.sh --against dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job that may write, and it runs no project code.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "cubby ${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md for what changed. Verify downloads with SHA256SUMS."
